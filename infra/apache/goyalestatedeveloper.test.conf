# Local-only vhost. Application source and configuration remain outside public/.
<VirtualHost 127.0.0.1:80>
    ServerName goyalestatedeveloper.test
    DocumentRoot "/Users/veenit/Sites/goyalestatedeveloper/public"
    DirectoryIndex index.php
    <Directory "/Users/veenit/Sites/goyalestatedeveloper/public">
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require local
        FallbackResource /index.php
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
